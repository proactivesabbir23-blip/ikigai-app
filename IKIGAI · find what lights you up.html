[["all","All",200]].concat(CL.map(c=>[c[0],c[3]+" "+c[1],c[2]])).map(c=>'<button class="chip'+(S.f===c[0]?" on":"")+'" style="--h:'+c[2]+'" onclick="S.f=\''+c[0]+'\';render()">'+c[1]+'</button>').join("")+'</div><div class="badges" id="bd"></div></div><div id="lst"></div>';}

const sc=i=>DW[i.market_demand_level]*100/Math.sqrt(i.min_hours_to_monetize),top=[...L].sort((a,b)=>sc(b)-sc(a)).slice(0,5),gems=L.filter(i=>i.gem),mxs=Math.max(...Object.keys(cs).map(k=>C[k].size));

const cm=cb.slice(0,3),best=Object.keys(cs).sort((a,b)=>C[b].gr-C[a].gr)[0],quick=L.filter(i=>i.min_hours_to_monetize<=200).length,hi=L.filter(i=>i.market_demand_level==="H").length;
return '<h2>Your market landscape</h2><p class="mu">Market sizes are rough, directional global estimates for each industry cluster, not forecasts.</p>'+
'<div class="box"><h3>Market scale by cluster</h3>'+Object.keys(cs).sort((a,b)=>C[b].size-C[a].size).map(k=>'<div class="row" style="--h:'+C[k].h+'"><div class="nm">'+C[k].e+" "+C[k].name+'</div><div class="bar"><b style="width:'+Math.max(4,C[k].size/mxs*100)+'%"></b></div><div class="v">~$'+(C[k].size>=1000?(C[k].size/1000).toFixed(1)+"T":C[k].size+"B")+' · +'+C[k].gr+'%/yr</div></div>').join("")+'</div>'+
'<h3 style="margin-top:22px">Most viable picks</h3><p class="mu">Ranked by demand against time to first income.</p><div class="two">'+top.map(i=>'<div class="box" style="--h:'+C[i.industry_cluster].h+'"><b>'+i.name+'</b> <span class="tag">'+DM[i.market_demand_level]+' demand</span><p class="mu" style="font-size:.88rem;margin:6px 0">'+i.career_summary+'</p>'+i.monetization_paths.map(p=>'<span class="tag">'+p+'</span>').join("")+'</div>').join("")+'</div>'+
(cm.length?'<h3 style="margin-top:22px">Standout combinations</h3><div class="two">'+cm.map(c=>'<div class="box"><b>'+c[0].name+' + '+c[1].name+'</b><p class="mu" style="font-size:.88rem;margin:6px 0 0">Cross-cluster pairs stand out: offer '+c[0].monetization_paths[0].toLowerCase()+' in '+c[0].name.toLowerCase()+', backed by '+c[1].monetization_paths[0].toLowerCase()+' from '+c[1].name.toLowerCase()+'. Two skill sets means fewer direct competitors.</p></div>').join("")+'</div>':"")+
